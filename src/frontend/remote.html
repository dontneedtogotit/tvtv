<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>tvtv Phone Web Remote</title>
<style>
  :root {
    --bg-base: #070b14;
    --card-bg: rgba(18, 28, 46, 0.78);
    --card-border: rgba(255, 255, 255, 0.09);
    --accent-cyan: #00d2ff;
    --accent-glow: rgba(0, 210, 255, 0.4);
    --text-primary: #ffffff;
    --text-secondary: #94a3b8;
    --btn-bg: rgba(255, 255, 255, 0.07);
    --btn-active: rgba(0, 210, 255, 0.28);
    --success: #10b981;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  body {
    background: radial-gradient(circle at top center, #111e33 0%, var(--bg-base) 100%);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    touch-action: manipulation;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 440px;
    margin-bottom: 14px;
    padding: 0 4px;
  }
  .brand {
    font-size: 22px;
    font-weight: 900;
    color: var(--accent-cyan);
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .brand span { color: #fff; font-weight: 400; font-size: 16px; }
  .status-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    background: rgba(0,0,0,0.4);
    padding: 4px 12px;
    border-radius: 9999px;
    border: 1px solid var(--card-border);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--success);
    box-shadow: 0 0 8px var(--success);
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 20px;
    padding: 18px;
    width: 100%;
    max-width: 440px;
    margin-bottom: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  }
  .card-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Keyboard typing box */
  .type-row {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 15px;
    color: #fff;
    outline: none;
    transition: all 0.2s;
  }
  input[type="text"]:focus {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .btn {
    background: var(--btn-bg);
    border: 1px solid var(--card-border);
    color: #fff;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s ease;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
  }
  .btn:active {
    transform: scale(0.95);
    background: var(--btn-active);
    border-color: var(--accent-cyan);
  }
  .btn-accent {
    background: linear-gradient(135deg, var(--accent-cyan) 0%, #0072ff 100%);
    color: #000;
    border: none;
    font-weight: 900;
    box-shadow: 0 4px 14px var(--accent-glow);
  }

  /* D-Pad layout */
  .dpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 64px);
    gap: 8px;
    max-width: 290px;
    margin: 8px auto;
  }
  .dpad-btn {
    font-size: 20px;
    border-radius: 16px;
  }
  .dpad-center {
    background: linear-gradient(135deg, rgba(0, 210, 255, 0.3) 0%, rgba(0, 114, 255, 0.3) 100%);
    border-color: var(--accent-cyan);
    font-size: 16px;
    font-weight: 900;
    color: var(--accent-cyan);
    box-shadow: 0 0 16px var(--accent-glow);
  }

  /* Playback & Volume Grid */
  .controls-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .controls-grid .btn {
    padding: 14px 6px;
    font-size: 15px;
  }

  /* App Switcher */
  .apps-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .app-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 4px;
    font-size: 11px;
    font-weight: 700;
  }
  .app-btn span { font-size: 20px; }

  /* Now Playing Card */
  #now-playing-box {
    display: none;
  }
  .np-title {
    font-size: 14px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
    color: #fff;
  }
  .np-channel {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .np-bar {
    height: 5px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 3px;
    overflow: hidden;
  }
  .np-bar-fill {
    height: 100%;
    background: var(--accent-cyan);
    width: 0%;
    box-shadow: 0 0 8px var(--accent-cyan);
  }
</style>
</head>
<body>
  <header>
    <div class="brand">tvtv <span>Remote</span></div>
    <div class="status-indicator">
      <div class="status-dot"></div>
      <span id="status-text">Connected</span>
    </div>
  </header>

  <!-- Now Playing Status -->
  <div class="card" id="now-playing-box">
    <div class="card-title">
      <span>Now Playing on TV</span>
      <span id="np-time-text" style="font-family: monospace; font-size: 11px;">0:00 / 0:00</span>
    </div>
    <div class="np-title" id="np-title">Loading...</div>
    <div class="np-channel" id="np-channel"></div>
    <div class="np-bar"><div class="np-bar-fill" id="np-bar-fill"></div></div>
  </div>

  <!-- Mobile Keyboard Search & Typing -->
  <div class="card">
    <div class="card-title">Phone Keyboard & Search</div>
    <div class="type-row">
      <input type="text" id="type-input" placeholder="Type text or search on TV..." />
      <button class="btn" id="btn-mic" style="display:none; padding:12px 14px;" title="Voice input">🎤</button>
      <button class="btn btn-accent" id="btn-send-type">Send</button>
    </div>
  </div>

  <!-- Virtual D-Pad -->
  <div class="card">
    <div class="card-title">Navigation D-Pad</div>
    <div class="dpad-grid">
      <div></div>
      <button class="btn dpad-btn" data-action="up">▲</button>
      <div></div>
      <button class="btn dpad-btn" data-action="left">◀</button>
      <button class="btn dpad-btn dpad-center" data-action="enter">OK</button>
      <button class="btn dpad-btn" data-action="right">▶</button>
      <button class="btn dpad-btn" data-action="back" style="font-size: 13px;">ESC</button>
      <button class="btn dpad-btn" data-action="down">▼</button>
      <button class="btn dpad-btn" data-action="home" style="font-size: 13px;">HOME</button>
    </div>
  </div>

  <!-- Playback & Audio Controls -->
  <div class="card">
    <div class="card-title">Playback & Volume</div>
    <div class="controls-grid" style="margin-bottom: 8px;">
      <button class="btn" data-action="seek-10">⏪ 10s</button>
      <button class="btn btn-accent" data-action="pause">⏯ Play</button>
      <button class="btn" data-action="seek+10">10s ⏩</button>
      <button class="btn" data-action="fullscreen">⛶ Full</button>
    </div>
    <div class="controls-grid">
      <button class="btn" data-action="vol-">🔉 Vol -</button>
      <button class="btn" data-action="vol+">🔊 Vol +</button>
      <button class="btn" data-action="mute">🔇 Mute</button>
      <button class="btn" data-action="stop" style="color: #ff5252;">⏹ Stop</button>
    </div>
  </div>

  <!-- Quick App Launchers -->
  <div class="card">
    <div class="card-title">Quick TV Apps</div>
    <div class="apps-grid">
      <button class="btn app-btn" id="app-yt">
        <span>▶️</span> YouTube
      </button>
      <button class="btn app-btn" id="app-cameras">
        <span>📹</span> Cameras
      </button>
      <button class="btn app-btn" id="app-settings">
        <span>⚙️</span> Settings
      </button>
      <button class="btn app-btn" id="app-installer">
        <span>🚀</span> Installer
      </button>
    </div>
  </div>

  <script>
    const API = '';

    function haptic() {
      if (navigator.vibrate) navigator.vibrate(22);
    }

    async function sendAction(action) {
      haptic();
      try {
        const r = await fetch(`${API}/api/control`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action }),
        });
        const data = await r.json();
        document.getElementById('status-text').textContent = data.status === 'ok' ? 'Sent' : (data.detail || 'Sent');
      } catch (e) {
        document.getElementById('status-text').textContent = 'Error';
      }
    }

    // Bind action buttons
    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => sendAction(btn.dataset.action));
    });

    // Keyboard type sender
    const typeInput = document.getElementById('type-input');
    const sendType = () => {
      const txt = typeInput.value.trim();
      if (txt) {
        sendAction('type:' + txt);
        typeInput.value = '';
      }
    };
    document.getElementById('btn-send-type').addEventListener('click', sendType);
    typeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendType();
    });

    // Voice recognition if supported
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = document.getElementById('btn-mic');
    if (SpeechRecognition) {
      micBtn.style.display = 'block';
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        typeInput.value = transcript;
        sendType();
      };
      micBtn.addEventListener('click', () => {
        haptic();
        recognition.start();
        document.getElementById('status-text').textContent = 'Listening…';
      });
    }

    // App Switcher
    document.getElementById('app-yt').addEventListener('click', () => sendAction('enter'));
    document.getElementById('app-cameras').addEventListener('click', () => window.open('/apps-frontend/camera-setup/', '_blank'));
    document.getElementById('app-settings').addEventListener('click', () => window.open('/apps-frontend/settings/', '_blank'));
    document.getElementById('app-installer').addEventListener('click', () => window.open('/apps-frontend/installer/', '_blank'));

    // Live position polling
    async function pollPosition() {
      try {
        const [pos, s] = await Promise.all([
          fetch(`${API}/api/position`).then(r => r.json()).catch(() => null),
          fetch(`${API}/api/playback/now-playing`).then(r => r.json()).catch(() => null),
        ]);
        const box = document.getElementById('now-playing-box');
        if (pos && pos.playing && pos.duration) {
          box.style.display = 'block';
          if (s && s.title) document.getElementById('np-title').textContent = s.title;
          if (s && s.channel) document.getElementById('np-channel').textContent = s.channel;
          const cur = Math.round(pos.time || 0);
          const tot = Math.round(pos.duration || 0);
          document.getElementById('np-time-text').textContent = `${Math.floor(cur/60)}:${String(cur%60).padStart(2,'0')} / ${Math.floor(tot/60)}:${String(tot%60).padStart(2,'0')}`;
          const pct = Math.min(100, Math.max(0, (cur / tot) * 100));
          document.getElementById('np-bar-fill').style.width = pct + '%';
        } else {
          box.style.display = 'none';
        }
      } catch (e) {}
    }
    setInterval(pollPosition, 2500);
    pollPosition();
  </script>
</body>
</html>
