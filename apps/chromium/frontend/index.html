<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Chromium Browser</title>
<link rel="stylesheet" href="/shared/frontend-shell/theme-tokens.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg-base, #06090e); color: var(--text-primary, #ffffff); font-family: "Segoe UI", "Noto Sans", system-ui, sans-serif; }
  body { padding: 24px 36px; display: flex; flex-direction: column; gap: 20px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-shrink: 0; }
  .brand-row { display: flex; align-items: center; gap: 14px; }
  #logo { font-weight: 900; color: var(--accent, #00d2ff); font-size: 1.4rem; letter-spacing: -0.5px; }
  .title { font-weight: 800; font-size: 1.25rem; }
  .status-badge {
    background: rgba(16, 185, 129, 0.15);
    color: #10b981;
    border: 1px solid #10b981;
    padding: 3px 12px;
    border-radius: var(--radius-pill, 999px);
    font-size: 0.75rem;
    font-weight: 800;
    text-transform: uppercase;
  }
  .status-badge.warn { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border-color: #f59e0b; }

  /* URL Navigation Bar */
  .address-bar-card {
    background: var(--surface-card, #162032);
    border: 2px solid var(--border-bright, #354e70);
    border-radius: 16px;
    padding: 14px 20px;
    display: flex;
    gap: 14px;
    align-items: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    flex-shrink: 0;
  }
  .address-input {
    flex: 1;
    background: #090e17;
    border: 1px solid var(--border-subtle, #223147);
    border-radius: 10px;
    padding: 12px 18px;
    color: #fff;
    font-size: 1.05rem;
    font-family: inherit;
    transition: border-color 0.15s ease;
  }
  .address-input:focus { outline: none; border-color: var(--accent, #00d2ff); box-shadow: 0 0 12px rgba(0, 210, 255, 0.25); }
  
  .btn-launch {
    background: linear-gradient(135deg, var(--accent, #00d2ff) 0%, #0284c7 100%);
    color: #000;
    border: 2px solid var(--accent, #00d2ff);
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s ease;
  }
  .btn-launch:hover { filter: brightness(1.1); transform: scale(1.02); }
  .btn-launch:focus { outline: none; box-shadow: 0 0 16px rgba(0, 210, 255, 0.4); }

  /* Bookmarks Grid */
  .section-label { font-size: 1.1rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .bookmarks-grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    align-content: start;
    padding-bottom: 24px;
  }

  .bookmark-card {
    background: var(--surface-card, #162032);
    border: 2px solid var(--border-subtle, #223147);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .bookmark-card:hover {
    border-color: var(--border-bright, #354e70);
    background: var(--surface-hover, #1e2c45);
    transform: translateY(-2px);
  }
  .bookmark-card:focus {
    outline: none;
    border-color: var(--accent, #00d2ff);
    box-shadow: 0 0 24px rgba(0, 210, 255, 0.25);
    transform: translateY(-2px) scale(1.02);
  }

  .bookmark-icon { font-size: 2.2rem; }
  .bookmark-name { font-size: 1.15rem; font-weight: 800; color: #fff; }
  .bookmark-url { font-size: 0.8rem; color: var(--text-muted, #64748b); font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bookmark-cat { font-size: 0.75rem; color: var(--accent, #00d2ff); font-weight: 700; margin-top: auto; }

  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface-card, #162032);
    border: 2px solid var(--accent, #00d2ff);
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    display: none;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>
  <header>
    <div class="brand-row">
      <div id="logo">tvtv</div>
      <div class="title">Chromium Web Browser</div>
      <span class="status-badge" id="browser-badge">Checking…</span>
    </div>
    <div style="font-size:0.85rem; color:var(--text-muted);">VA-API Hardware Accelerated &bull; 10-Foot Living Room TV</div>
  </header>

  <div class="address-bar-card">
    <input type="text" class="address-input" id="address-input" placeholder="Enter website address (e.g. netflix.com, twitch.tv) or search term..." tabindex="0" />
    <button class="btn-launch" id="btn-open-window" tabindex="0">🚀 Open in Native Window</button>
  </div>

  <div class="section-label">⭐ TV Streaming & Web Apps</div>
  <div class="bookmarks-grid" id="bookmarks-grid"></div>

  <div id="toast"></div>

  <script type="module">
    import { initFocusNav } from '/shared/frontend-shell/focus-nav.js';
    initFocusNav(document);

    const addressInput = document.getElementById('address-input');
    const btnOpenWindow = document.getElementById('btn-open-window');
    const bookmarksGrid = document.getElementById('bookmarks-grid');
    const browserBadge = document.getElementById('browser-badge');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }

    async function checkStatus() {
      try {
        const r = await fetch('/apps/chromium/status');
        const data = await r.json();
        if (data.installed) {
          browserBadge.textContent = `${data.binary_name.toUpperCase()} (NATIVE)`;
          browserBadge.classList.remove('warn');
        } else {
          browserBadge.textContent = 'BROWSER NOT INSTALLED';
          browserBadge.classList.add('warn');
        }
      } catch (e) {
        browserBadge.textContent = 'ONLINE';
      }
    }

    async function launchBrowser(url, kiosk = false) {
      if (!url) url = addressInput.value.trim();
      if (!url) url = 'https://duckduckgo.com';
      showToast(`Launching browser: ${url}…`);
      try {
        const r = await fetch('/apps/chromium/launch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, kiosk })
        });
        const res = await r.json();
        if (res.status === 'ok') {
          showToast(`✓ Launched ${res.browser} (PID: ${res.pid})`);
        } else {
          showToast('Launch failed: ' + (res.detail || res.message));
        }
      } catch (e) {
        showToast('Error launching browser: ' + e.message);
      }
    }

    async function loadBookmarks() {
      try {
        const r = await fetch('/apps/chromium/bookmarks');
        const data = await r.json();
        const bookmarks = data.bookmarks || [];
        bookmarksGrid.innerHTML = '';
        
        for (const b of bookmarks) {
          const card = document.createElement('div');
          card.className = 'bookmark-card';
          card.tabIndex = 0;
          card.innerHTML = `
            <div class="bookmark-icon">${b.icon}</div>
            <div class="bookmark-name">${b.name}</div>
            <div class="bookmark-url">${b.url}</div>
            <div class="bookmark-cat">${b.category}</div>
          `;
          card.addEventListener('click', () => launchBrowser(b.url));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              launchBrowser(b.url);
            }
          });
          bookmarksGrid.appendChild(card);
        }
      } catch (e) {
        console.warn('Bookmarks load error:', e);
      }
    }

    btnOpenWindow.addEventListener('click', () => launchBrowser(addressInput.value.trim()));
    addressInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') launchBrowser(addressInput.value.trim());
    });

    checkStatus();
    loadBookmarks();
  </script>
</body>
</html>
