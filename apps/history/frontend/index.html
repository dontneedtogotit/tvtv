<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>tvtv Watch History</title>
<link rel="stylesheet" href="/shared/frontend-shell/theme-tokens.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: var(--fs-base-px, 20px);
    overflow: hidden;
    user-select: none;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    background: var(--surface-glass);
    backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand {
    font-weight: 900;
    font-size: 1.4rem;
    color: var(--accent);
    cursor: pointer;
  }
  .app-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-strong);
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .btn-nav {
    background: var(--surface-card);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: 8px 16px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition);
  }
  .btn-nav:hover, .btn-nav:focus {
    border-color: var(--accent);
    background: var(--surface-hover);
    outline: none;
  }
  .btn-danger {
    border-color: var(--danger);
    color: var(--danger);
  }
  .btn-danger:hover, .btn-danger:focus {
    background: rgba(239, 68, 68, 0.15);
    border-color: var(--danger);
  }
  #content {
    padding: 24px 32px;
    overflow-y: auto;
    height: calc(100% - 74px);
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .history-item {
    background: var(--surface-card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    transition: all var(--transition);
    outline: none;
  }
  .history-item:hover, .history-item:focus, .history-item.focused {
    border-color: var(--accent);
    transform: var(--lift);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 16px var(--accent-soft);
    background: var(--surface-hover);
  }
  .item-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .item-title {
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--text-strong);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-meta {
    font-size: 0.85rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .item-badge {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    font-size: 0.75rem;
    font-weight: 700;
  }
  .empty-state {
    padding: 60px 24px;
    text-align: center;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .empty-state .ico { font-size: 3.5rem; }
</style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="brand" id="btn-back" tabindex="0">← Back</div>
      <div class="app-title">🕘 Watch History</div>
    </div>
    <div class="header-right">
      <button class="btn-nav" id="btn-refresh" tabindex="0">🔄 Refresh</button>
      <button class="btn-nav btn-danger" id="btn-clear" tabindex="0">🗑 Clear History</button>
    </div>
  </header>

  <div id="content">
    <div class="history-list" id="list">
      <div class="empty-state">
        <div class="ico">⏳</div>
        <div>Loading watch history…</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initFocusNav } from '/shared/frontend-shell/focus-nav.js';
    initFocusNav(document);

    const API = '';
    const list = document.getElementById('list');

    function fmtTime(sec) {
      if (!sec) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    async function playItem(item) {
      const seek = (item.position || 0) > 5 ? item.position : undefined;
      await fetch(`${API}/api/play`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          url: item.url,
          title: item.title,
          fullscreen: true,
          seek: seek
        })
      });
    }

    async function load() {
      try {
        const r = await fetch(`${API}/history`);
        const data = await r.json();
        const items = data.items || [];
        list.innerHTML = '';

        if (!items.length) {
          list.innerHTML = `
            <div class="empty-state">
              <div class="ico">🎬</div>
              <div style="font-size:1.2rem; font-weight:800; color:var(--text);">No watch history yet</div>
              <div>Videos and media you watch will appear here with your resume positions.</div>
            </div>`;
          return;
        }

        for (const item of items) {
          const el = document.createElement('div');
          el.className = 'history-item';
          el.tabIndex = 0;
          const pos = fmtTime(item.position);
          const dur = fmtTime(item.duration);
          el.innerHTML = `
            <div class="item-main">
              <div class="item-title">${item.title || item.url}</div>
              <div class="item-meta">
                <span>${item.channel || 'Media'}</span>
                ${item.duration ? `<span>• Progress: ${pos} / ${dur}</span>` : ''}
              </div>
            </div>
            ${item.position > 5 ? `<div class="item-badge">Resume at ${pos}</div>` : `<div class="item-badge">▶ Watch</div>`}
          `;
          el.addEventListener('click', () => playItem(item));
          list.appendChild(el);
        }
      } catch (e) {
        list.innerHTML = '<div class="empty-state" style="color:var(--danger);"><div class="ico">⚠️</div><div>Failed to load history</div></div>';
      }
    }

    document.getElementById('btn-clear').addEventListener('click', async () => {
      if (confirm('Clear entire watch history?')) {
        await fetch(`${API}/history`, { method: 'DELETE' });
        load();
      }
    });

    document.getElementById('btn-refresh').addEventListener('click', load);

    document.getElementById('btn-back').addEventListener('click', () => {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage('tvtv:back', '*');
      } else {
        window.location.href = '/';
      }
    });

    load();
  </script>
</body>
</html>
