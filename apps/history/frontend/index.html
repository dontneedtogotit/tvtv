<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>History</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --border: #2a2a2a;
    --accent: #ff0033;
    --text: #f0f0f0;
    --muted: #888888;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 20px;
    height: 100%;
    margin: 0;
    user-select: none;
  }
  header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  #logo { font-weight: 900; color: var(--accent); font-size: 1.4rem; cursor: pointer; }
  #content { padding: 18px 24px; overflow: auto; height: calc(100% - 72px); }
  .row { display: flex; flex-direction: column; gap: 12px; }
  .item {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
  }
  .title { font-weight: 700; }
  .meta { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
  <header>
    <div id="logo">tvtv</div>
    <div>History</div>
  </header>
  <div id="content">
    <div class="row" id="grid"></div>
  </div>
  <script type="module">
    import { initFocusNav } from '/shared/frontend-shell/focus-nav.js';
    initFocusNav(document);
    const API = ''; // relative to serving origin (works on LAN remote too)
    const grid = document.getElementById('grid');
    async function load() {
      const r = await fetch(`${API}/history`);
      const data = await r.json();
      grid.innerHTML = '';
      for (const item of (data.items || [])) {
        const el = document.createElement('div');
        el.className = 'item';
        el.tabIndex = 0;
        el.innerHTML = `<div class="title">${item.title}</div><div class="meta">${item.url}</div>`;
        el.addEventListener('click', () => {
          fetch(`${API}/api/play`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: item.url, fullscreen: true }) });
        });
        grid.appendChild(el);
      }
    }
    load();
  </script>
</body>
</html>
