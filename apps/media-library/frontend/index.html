<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Media Library</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --border: #2a2a2a;
    --accent: #ff0033;
    --text: #f0f0f0;
    --muted: #888888;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 20px;
    height: 100%;
    margin: 0;
    user-select: none;
  }
  header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  #logo { font-weight: 900; color: var(--accent); font-size: 1.4rem; cursor: pointer; }
  #content { padding: 18px 24px; overflow: auto; height: calc(100% - 72px); }
  .row { display: flex; flex-wrap: wrap; gap: 18px; }
  .tile {
    width: 200px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: transform .12s, border-color .12s;
  }
  .tile:hover, .tile.focused { border-color: var(--accent); transform: translateY(-2px); }
  .name { font-weight: 700; font-size: 0.95rem; margin-top: 8px; }
  .meta { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
  <header>
    <div id="logo">tvtv</div>
    <div>Media Library</div>
  </header>
  <div id="content">
    <div class="row" id="grid"></div>
  </div>
  <script type="module">
    import { initFocusNav } from '/shared/frontend-shell/focus-nav.js';
    initFocusNav(document);
    const API = ''; // relative to serving origin (works on LAN remote too)
    const grid = document.getElementById('grid');
    async function load() {
      const r = await fetch(`${API}/apps/media-library/scan`);
      const data = await r.json();
      grid.innerHTML = '';
      for (const item of (data.items || [])) {
        const el = document.createElement('div');
        el.className = 'tile';
        el.tabIndex = 0;
        el.innerHTML = `<div class="name">${item.name}</div><div class="meta">${item.type}</div>`;
        el.addEventListener('click', () => alert(item.path));
        grid.appendChild(el);
      }
    }
    load();
  </script>
</body>
</html>
