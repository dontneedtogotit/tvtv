<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>tvtv Phone Web Remote</title>
<style>
  :root {
    --bg-base: #0a0e17;
    --card-bg: rgba(22, 32, 50, 0.75);
    --card-border: rgba(255, 255, 255, 0.08);
    --accent-cyan: #00d2ff;
    --accent-glow: rgba(0, 210, 255, 0.35);
    --text-primary: #ffffff;
    --text-secondary: #94a3b8;
    --btn-bg: rgba(255, 255, 255, 0.06);
    --btn-active: rgba(0, 210, 255, 0.25);
    --success: #10b981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  body {
    background: radial-gradient(circle at top center, #131c2d 0%, var(--bg-base) 100%);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    touch-action: manipulation;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 420px;
    margin-bottom: 14px;
  }
  .brand {
    font-size: 20px;
    font-weight: 900;
    color: var(--accent-cyan);
    letter-spacing: -0.5px;
  }
  .brand span { color: #fff; font-weight: 400; }
  .status-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--success);
    box-shadow: 0 0 8px var(--success);
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 18px;
    padding: 16px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }
  .card-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    margin-bottom: 10px;
    font-weight: 700;
  }

  /* Keyboard typing box */
  .type-row {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    color: #fff;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 8px var(--accent-glow);
  }

  .btn {
    background: var(--btn-bg);
    border: 1px solid var(--card-border);
    color: #fff;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s ease;
    user-select: none;
    -webkit-user-select: none;
  }
  .btn:active {
    transform: scale(0.96);
    background: var(--btn-active);
    border-color: var(--accent-cyan);
  }
  .btn-accent {
    background: linear-gradient(135deg, var(--accent-cyan) 0%, #0072ff 100%);
    color: #000;
    border: none;
    font-weight: 800;
  }

  /* D-Pad layout */
  .dpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 64px);
    gap: 8px;
    max-width: 280px;
    margin: 6px auto;
  }
  .dpad-btn {
    font-size: 20px;
    border-radius: 16px;
  }
  .dpad-center {
    background: linear-gradient(135deg, rgba(0, 210, 255, 0.25) 0%, rgba(0, 114, 255, 0.25) 100%);
    border-color: var(--accent-cyan);
    font-size: 15px;
    font-weight: 900;
  }

  /* Playback & Volume Grid */
  .controls-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .controls-grid .btn {
    padding: 14px 8px;
    font-size: 16px;
  }

  /* App Switcher */
  .apps-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .app-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 4px;
    font-size: 11px;
  }
  .app-btn span { font-size: 18px; }

  /* Now Playing Card */
  #now-playing-box {
    display: none;
  }
  .np-title {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .np-channel {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .np-bar {
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
  }
  .np-bar-fill {
    height: 100%;
    background: var(--accent-cyan);
    width: 0%;
  }
</style>
</head>
<body>
  <header>
    <div class="brand">tvtv <span>Remote</span></div>
    <div class="status-indicator">
      <div class="status-dot"></div>
      <span id="status-text">Connected</span>
    </div>
  </header>

  <!-- Now Playing Status -->
  <div class="card" id="now-playing-box">
    <div class="card-title">Now Playing on TV</div>
    <div class="np-title" id="np-title">Loading...</div>
    <div class="np-channel" id="np-channel"></div>
    <div class="np-bar"><div class="np-bar-fill" id="np-bar-fill"></div></div>
  </div>

  <!-- Mobile Keyboard Search & Typing -->
  <div class="card">
    <div class="card-title">Phone Keyboard & Search</div>
    <div class="type-row">
      <input type="text" id="type-input" placeholder="Type text or search on TV..." />
      <button class="btn btn-accent" id="btn-send-type">Send</button>
    </div>
  </div>

  <!-- Virtual D-Pad -->
  <div class="card">
    <div class="card-title">Navigation D-Pad</div>
    <div class="dpad-grid">
      <div></div>
      <button class="btn dpad-btn" data-action="up">▲</button>
      <div></div>
      <button class="btn dpad-btn" data-action="left">◀</button>
      <button class="btn dpad-btn dpad-center" data-action="enter">OK</button>
      <button class="btn dpad-btn" data-action="right">▶</button>
      <button class="btn dpad-btn" data-action="back" style="font-size: 14px;">ESC</button>
      <button class="btn dpad-btn" data-action="down">▼</button>
      <button class="btn dpad-btn" data-action="home" style="font-size: 14px;">HOME</button>
    </div>
  </div>

  <!-- Playback & Audio Controls -->
  <div class="card">
    <div class="card-title">Playback & Volume</div>
    <div class="controls-grid" style="margin-bottom: 8px;">
      <button class="btn" data-action="seek-10">⏪ 10s</button>
      <button class="btn btn-accent" data-action="pause">⏯ Play</button>
      <button class="btn" data-action="seek+10">10s ⏩</button>
      <button class="btn" data-action="fullscreen">⛶ Full</button>
    </div>
    <div class="controls-grid">
      <button class="btn" data-action="vol-">🔉 Vol -</button>
      <button class="btn" data-action="vol+">🔊 Vol +</button>
      <button class="btn" data-action="mute">🔇 Mute</button>
      <button class="btn" data-action="stop" style="color: #ff4757;">⏹ Stop</button>
    </div>
  </div>

  <!-- Quick App Launchers -->
  <div class="card">
    <div class="card-title">Quick Apps</div>
    <div class="apps-grid">
      <button class="btn app-btn" id="app-yt">
        <span>▶️</span> YouTube
      </button>
      <button class="btn app-btn" id="app-cameras">
        <span>📹</span> Cameras
      </button>
      <button class="btn app-btn" id="app-settings">
        <span>⚙️</span> Settings
      </button>
      <button class="btn app-btn" id="app-installer">
        <span>🚀</span> Installer
      </button>
    </div>
  </div>

  <script>
    const API = '';

    async function sendAction(action) {
      try {
        const r = await fetch(`${API}/api/control`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action }),
        });
        const data = await r.json();
        document.getElementById('status-text').textContent = data.status === 'ok' ? 'Sent' : (data.detail || 'Sent');
      } catch (e) {
        document.getElementById('status-text').textContent = 'Error';
      }
    }

    // Bind action buttons
    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => sendAction(btn.dataset.action));
    });

    // Keyboard type sender
    const typeInput = document.getElementById('type-input');
    document.getElementById('btn-send-type').addEventListener('click', () => {
      const txt = typeInput.value.trim();
      if (txt) {
        sendAction('type:' + txt);
        typeInput.value = '';
      }
    });
    typeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const txt = typeInput.value.trim();
        if (txt) {
          sendAction('type:' + txt);
          typeInput.value = '';
        }
      }
    });

    // App Switcher
    document.getElementById('app-yt').addEventListener('click', () => sendAction('enter'));
    document.getElementById('app-cameras').addEventListener('click', () => window.open('/apps-frontend/camera-setup/', '_blank'));
    document.getElementById('app-settings').addEventListener('click', () => window.open('/apps-frontend/settings/', '_blank'));
    document.getElementById('app-installer').addEventListener('click', () => window.open('/apps-frontend/installer/', '_blank'));

    // Live position polling
    async function pollPosition() {
      try {
        const r = await fetch(`${API}/api/position`);
        const data = await r.json();
        const box = document.getElementById('now-playing-box');
        if (data.playing && data.duration) {
          box.style.display = 'block';
          const pct = Math.min(100, Math.max(0, (data.time / data.duration) * 100));
          document.getElementById('np-bar-fill').style.width = pct + '%';
        } else {
          box.style.display = 'none';
        }
      } catch (e) {}
    }
    setInterval(pollPosition, 3000);
    pollPosition();
  </script>
</body>
</html>
