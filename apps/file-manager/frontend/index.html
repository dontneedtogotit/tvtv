<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>tvtv File Manager</title>
<link rel="stylesheet" href="/shared/frontend-shell/theme-tokens.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: var(--fs-base-px, 20px);
    overflow: hidden;
    user-select: none;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    background: var(--surface-glass);
    backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand {
    font-weight: 900;
    font-size: 1.4rem;
    color: var(--accent);
    cursor: pointer;
  }
  .app-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text-strong);
  }
  .path-bar {
    background: var(--surface-card);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-family: monospace;
    font-size: 0.9rem;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 600px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .btn-nav {
    background: var(--surface-card);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    padding: 8px 16px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition);
  }
  .btn-nav:hover, .btn-nav:focus {
    border-color: var(--accent);
    background: var(--surface-hover);
    outline: none;
  }
  #content {
    padding: 24px 32px;
    overflow-y: auto;
    height: calc(100% - 74px);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
  }
  .file-card {
    background: var(--surface-card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    flex-direction: column;
    gap: 8px;
    outline: none;
  }
  .file-card:hover, .file-card:focus, .file-card.focused {
    border-color: var(--accent);
    transform: var(--lift);
    box-shadow: 0 10px 24px rgba(0,0,0,0.5), 0 0 16px var(--accent-soft);
    background: var(--surface-hover);
  }
  .file-ico {
    font-size: 2.2rem;
    line-height: 1;
  }
  .file-name {
    font-weight: 800;
    font-size: 1rem;
    color: var(--text-strong);
    word-break: break-word;
    line-height: 1.3;
  }
  .file-meta {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-family: monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface-card);
    border: 2px solid var(--accent);
    color: #fff;
    padding: 12px 20px;
    border-radius: var(--radius);
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    z-index: 100;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="brand" id="btn-back" tabindex="0">← Back</div>
      <div class="app-title">📁 File Manager</div>
    </div>
    <div class="path-bar" id="path-display">/home/htpc/media</div>
    <div class="header-right">
      <button class="btn-nav" id="btn-parent" tabindex="0">⬆ Up Directory</button>
      <button class="btn-nav" id="btn-refresh" tabindex="0">🔄 Refresh</button>
    </div>
  </header>

  <div id="content">
    <div class="grid" id="grid"></div>
  </div>

  <div id="toast" style="display:none;" class="toast"></div>

  <script type="module">
    import { initFocusNav } from '/shared/frontend-shell/focus-nav.js';
    initFocusNav(document);

    const API = '';
    const grid = document.getElementById('grid');
    const pathDisplay = document.getElementById('path-display');
    const toast = document.getElementById('toast');
    let currentPath = '/home/htpc/media';

    function showToast(msg) {
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2800);
    }

    const MEDIA_EXTS = new Set(['.mp4', '.mkv', '.webm', '.avi', '.mov', '.flv', '.ts', '.m4v', '.mp3', '.flac', '.ogg', '.wav', '.m4a']);

    function isMediaFile(name) {
      const idx = name.lastIndexOf('.');
      return idx !== -1 && MEDIA_EXTS.has(name.slice(idx).toLowerCase());
    }

    async function playFile(item) {
      showToast(`Playing: ${item.name}`);
      try {
        await fetch(`${API}/api/play`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: item.path,
            title: item.name,
            fullscreen: true
          })
        });
      } catch (e) {
        showToast('Playback launch failed.');
      }
    }

    async function loadDir(path) {
      currentPath = path || currentPath;
      pathDisplay.textContent = currentPath;
      grid.innerHTML = '<div style="color:var(--text-muted); padding:20px;">Reading directory…</div>';

      try {
        const r = await fetch(`${API}/apps/file-manager/list?path=${encodeURIComponent(currentPath)}`);
        const data = await r.json();
        const items = data.items || [];
        grid.innerHTML = '';

        if (!items.length) {
          grid.innerHTML = '<div style="color:var(--text-muted); padding:20px;">Directory is empty.</div>';
          return;
        }

        for (const item of items) {
          const isDir = item.type === 'directory';
          const isMedia = isMediaFile(item.name);
          const icon = isDir ? '📁' : (isMedia ? '🎞️' : '📄');

          const el = document.createElement('div');
          el.className = 'file-card';
          el.tabIndex = 0;
          el.innerHTML = `
            <div class="file-ico">${icon}</div>
            <div class="file-name">${item.name}</div>
            <div class="file-meta">${isDir ? 'Folder' : (item.size ? Math.round(item.size/1024/1024*10)/10 + ' MB' : 'File')}</div>
          `;

          el.addEventListener('click', () => {
            if (isDir) {
              loadDir(item.path);
            } else if (isMedia) {
              playFile(item);
            } else {
              showToast(`File: ${item.name}`);
            }
          });

          grid.appendChild(el);
        }
      } catch (e) {
        grid.innerHTML = '<div style="color:var(--danger); padding:20px;">Failed to load directory.</div>';
      }
    }

    document.getElementById('btn-parent').addEventListener('click', () => {
      if (currentPath && currentPath !== '/') {
        const parts = currentPath.split('/').filter(Boolean);
        parts.pop();
        loadDir('/' + parts.join('/'));
      }
    });

    document.getElementById('btn-refresh').addEventListener('click', () => loadDir(currentPath));

    document.getElementById('btn-back').addEventListener('click', () => {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage('tvtv:back', '*');
      } else {
        window.location.href = '/';
      }
    });

    loadDir('/home/htpc/media');
  </script>
</body>
</html>
