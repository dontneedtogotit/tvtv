<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>File Manager</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --border: #2a2a2a;
    --accent: #ff0033;
    --text: #f0f0f0;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 20px;
    height: 100%;
    margin: 0;
    overflow: hidden;
    user-select: none;
  }
  header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  #logo {
    font-weight: 900;
    color: var(--accent);
    font-size: 1.4rem;
    cursor: pointer;
  }
  #path {
    font-size: 1rem;
    color: #aaa;
  }
  #content {
    height: calc(100% - 72px);
    overflow: auto;
    padding: 18px 24px;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  .tile {
    width: 180px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    transition: transform .12s, border-color .12s;
  }
  .tile:hover, .tile.focused {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .name {
    font-weight: 700;
    font-size: 0.95rem;
    margin-top: 6px;
  }
  .meta {
    font-size: 0.8rem;
    color: #888;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <header>
    <div id="logo">tvtv</div>
    <div id="path">/home/htpc/media</div>
  </header>
  <div id="content">
    <div class="row" id="grid"></div>
  </div>
  <script>
    const API = ''; // relative to serving origin (works on LAN remote too)
    const grid = document.getElementById('grid');
    const pathEl = document.getElementById('path');

    async function loadDir(path = '/home/htpc/media') {
      pathEl.textContent = path;
      const r = await fetch(`${API}/apps/file-manager/list?path=${encodeURIComponent(path)}`);
      const data = await r.json();
      grid.innerHTML = '';
      for (const item of data.items || []) {
        const el = document.createElement('div');
        el.className = 'tile';
        el.innerHTML = `<div class="name">${item.name}</div><div class="meta">${item.type || 'file'}</div>`;
        el.addEventListener('click', () => {
          if (item.type === 'directory') loadDir(item.path);
        });
        grid.appendChild(el);
      }
    }

    loadDir();
  </script>
  <script type="module">
    import { initFocusNav } from '/shared/frontend-shell/focus-nav.js';
    initFocusNav(document);
  </script>
</body>
</html>
