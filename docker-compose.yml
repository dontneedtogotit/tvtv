version: "3.9"

services:
  invidious:
    image: quay.io/invidious/invidious:latest
    container_name: tvtv-invidious
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: invidious
          password: ${INV_DB_PASS:-invidious}
          host: postgres
          port: 5432
        redis:
          host: redis
        visibilite: private
        external_port: 3000
        domain:
          - localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: tvtv-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: invidious
      POSTGRES_PASSWORD: ${INV_DB_PASS:-invidious}
      POSTGRES_DB: invidious
    volumes:
      - invidious-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invidious"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tvtv-redis
    restart: unless-stopped
    volumes:
      - invidious-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  invidious-db:
  invidious-redis:
