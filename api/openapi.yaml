openapi: 3.0.3
info:
  title: TVTV Streaming Orchestration API
  version: 1.0.0
  description: Typed, version-ed API for live TV ingestion, transcoding, and streaming management.
paths:
  /v1/streams:
    get:
      summary: List or filter live streams
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, active, transcoding, failed]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stream'
        '500':
          $ref: '#/components/responses/Error'
  /v1/streams/{id}:
    get:
      summary: Get stream details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stream'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /v1/streams/{id}/bookmark:
    post:
      summary: Bookmark a stream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Bookmark created successfully
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

components:
  schemas:
    Stream:
      type: object
      required:
        - id
        - title
        - startTime
        - duration
        - status
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startTime:
          type: string
          format: date-time
        duration:
          type: integer
        drmKeyId:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, active, transcoding, failed]
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
          format: uuid

  responses:
    Error:
      description: Error response format
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
