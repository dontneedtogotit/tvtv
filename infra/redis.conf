# Redis configuration for TVTV orchestration
# Loaded with: redis-server /home/z/Projects/tvtv/infra/redis.conf

bind 127.0.0.1
protected-mode yes
port 6379
tcp-keepalive 60
timeout 0

# Persistence (RDB + AOF) for job durability across restarts
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

maxmemory 512mb
maxmemory-policy allkeys-lru