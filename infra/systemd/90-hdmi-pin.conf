# 90-hdmi-pin.conf — HDMI audio output pinning (P13-4)
# Pins the default audio sink to HDMI so alsa/card changes don't steal output.
context.properties = {
    default.clock.rate = 48000
    default.clock.quantum = 1024
}

# Force HDMI as the default device profile
context.modules = [
    { name = libpipewire-module-rtkit
      args = {
          nice.level = -11
          rt.prio = 88
      }
    }
]
